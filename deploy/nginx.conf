## Nginx reverse proxy for InfyTrack.
##
## Install:
##   sudo cp deploy/nginx.conf /etc/nginx/sites-available/infytrack
##   sudo sed -i 's/yourdomain.example/actual-domain.com/' /etc/nginx/sites-available/infytrack
##   sudo ln -s /etc/nginx/sites-available/infytrack /etc/nginx/sites-enabled/
##   sudo nginx -t && sudo systemctl reload nginx
##
## Then get a certificate (this rewrites the file to add the TLS server
## block automatically):
##   sudo certbot --nginx -d yourdomain.example

server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.example;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
